{% extends "base.html" %}

{% block title %}{{ title }} — Synchronized Stream — pyst{% endblock %}

{% block extra_head %}
<style>
  .sync-wrapper {
    max-width: 1000px;
    margin: 1.5rem auto;
  }
  h1 {
    margin-bottom: 0.35rem;
  }
  .sync-desc {
    color: var(--text-muted);
    margin-bottom: 1.25rem;
  }
  .picker-container {
    margin: 1rem 0;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  select {
    background: #0d1117;
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    padding: 0.55rem 0.8rem;
    font-size: 0.95rem;
  }
  select:focus {
    outline: none;
    border-color: var(--accent);
  }
  #status {
    min-height: 1.5em;
    color: #9ed0ff;
    font-weight: 500;
    margin: 0.75rem 0;
  }
  #audio-notice {
    display: none;
    background: rgba(210, 153, 34, 0.15);
    border: 1px solid rgba(210, 153, 34, 0.4);
    color: #e3b341;
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin: 0.75rem 0 1rem 0;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  #audio-notice code {
    background: rgba(0, 0, 0, 0.3);
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    color: #fff;
  }
  #join {
    display: none;
    margin-bottom: 1rem;
    padding: 0.55rem 1rem;
    font-size: 0.95rem;
    font-weight: 600;
    background: #238636;
    color: #fff;
    border: 1px solid rgba(240, 246, 252, 0.1);
    border-radius: 6px;
    cursor: pointer;
  }
  #join:hover {
    background: #2ea043;
  }
  video {
    display: block;
    width: 100%;
    max-height: 75vh;
    margin-top: 1rem;
    background: #000;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
  }
</style>
{% endblock %}

{% block content %}
<div class="sync-wrapper" data-role="{{ role }}">
  <h1>{{ title }}</h1>
  <p class="sync-desc">{{ description }}</p>

  {% if role == "host" %}
  <div class="picker-container">
    <label for="file-picker" style="font-weight: 500;">Video from downloads: </label>
    <select id="file-picker">
      <option value="">Choose a video...</option>
      {% for file in files %}
      <option value="{{ file.path }}">{{ file.name }}</option>
      {% endfor %}
    </select>
  </div>
  {% endif %}

  <div id="audio-notice"></div>

  <p id="status">Waiting for a video selection...</p>
  <button id="join" type="button">Enable playback</button>

  <video id="player" controls playsinline></video>
</div>

<script>
  const basePath = window.location.pathname.startsWith('/sync') ? '/sync' : '';
  const player = document.getElementById("player");
  const status = document.getElementById("status");
  const joinButton = document.getElementById("join");
  const picker = document.getElementById("file-picker");
  const audioNotice = document.getElementById("audio-notice");
  let currentFile = null;
  let lastSeenRevision = -1;
  let appliedRevision = -1;
  let latestState = null;
  let remotePlaybackEvent = null;
  let remoteSeekPosition = null;
  let remoteSeekTimeout = null;

  async function sendControl(action, position = player.currentTime) {
    try {
      const response = await fetch(basePath + "/api/control", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action, position })
      });
      if (!response.ok) {
        status.textContent = `Control update failed (${response.status}).`;
      }
    } catch (error) {
      status.textContent = `Control update failed: ${error.message}`;
    }
  }

  player.addEventListener("play", () => {
    if (remotePlaybackEvent === "play") {
      remotePlaybackEvent = null;
      return;
    }
    sendControl("play");
  });

  player.addEventListener("pause", () => {
    if (remotePlaybackEvent === "pause") {
      remotePlaybackEvent = null;
      return;
    }
    if (!player.ended) sendControl("pause");
  });

  player.addEventListener("ended", () => sendControl("pause", player.currentTime));

  player.addEventListener("seeked", () => {
    if (remoteSeekPosition !== null) {
      const isRemoteSeek = Math.abs(player.currentTime - remoteSeekPosition) < 0.05;
      remoteSeekPosition = null;
      clearTimeout(remoteSeekTimeout);
      if (isRemoteSeek) return;
    }
    if (!player.paused) {
      remotePlaybackEvent = "pause";
      player.pause();
    }
    sendControl("pause");
  });

  player.addEventListener("error", () => {
    if (currentFile) status.textContent = "This browser could not play the selected video.";
  });

  if (picker) {
    picker.addEventListener("change", async () => {
      if (!picker.value) return;
      try {
        const response = await fetch(basePath + "/api/control", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "select", file: picker.value })
        });
        if (!response.ok) status.textContent = `Could not select video (${response.status}).`;
      } catch (error) {
        status.textContent = `Could not select video: ${error.message}`;
      }
    });
  }

  joinButton.addEventListener("click", async () => {
    joinButton.style.display = "none";
    try {
      await player.play();
    } catch (error) {
      status.textContent = "Playback could not start. Use the video controls to try again.";
    }
  });

  async function applyState(state) {
    latestState = state;
    if (state.file !== currentFile) {
      currentFile = state.file;
      appliedRevision = -1;
      if (!player.paused) {
        remotePlaybackEvent = "pause";
        player.pause();
      }
      player.removeAttribute("src");
      player.load();
      if (currentFile) {
        player.src = `${basePath}/video?path=${encodeURIComponent(currentFile)}`;
        player.load();
        if (picker) picker.value = currentFile;
        status.textContent = `Selected: ${state.name}`;

        if (audioNotice) {
          if (state.unsupported_audio) {
            audioNotice.style.display = "block";
            audioNotice.innerHTML = `⚠️ <strong>Audio Codec Warning (${(state.audio_codec || '').toUpperCase()})</strong>: Browsers do not support AC3/DTS audio. If there is no sound, convert to AAC:<br><code>pyst convert "${state.file}"</code>`;
          } else {
            audioNotice.style.display = "none";
          }
        }
      } else {
        if (picker) picker.value = "";
        status.textContent = "Waiting for a video selection...";
        if (audioNotice) audioNotice.style.display = "none";
      }
    }
    if (!currentFile || player.readyState < 1 || appliedRevision === state.revision) return;

    appliedRevision = state.revision;
    const targetPosition = Number.isFinite(player.duration)
      ? Math.min(state.position, player.duration)
      : state.position;
    if (Math.abs(player.currentTime - targetPosition) > 0.05) {
      remoteSeekPosition = targetPosition;
      clearTimeout(remoteSeekTimeout);
      remoteSeekTimeout = setTimeout(() => { remoteSeekPosition = null; }, 1000);
      player.currentTime = targetPosition;
    }

    if (state.playing && player.paused) {
      remotePlaybackEvent = "play";
      try {
        await player.play();
        joinButton.style.display = "none";
      } catch (error) {
        remotePlaybackEvent = null;
        joinButton.style.display = "inline-block";
        status.textContent = "Playback is ready. Click Enable playback to allow this browser to play.";
      }
    } else if (!state.playing && !player.paused) {
      remotePlaybackEvent = "pause";
      player.pause();
    }
  }

  async function listenForUpdates() {
    while (true) {
      try {
        const response = await fetch(`${basePath}/api/state?after=${lastSeenRevision}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`State request failed (${response.status})`);
        const state = await response.json();
        lastSeenRevision = state.revision;
        await applyState(state);
      } catch (error) {
        status.textContent = error.message;
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
  }

  player.addEventListener("loadedmetadata", () => {
    if (latestState) applyState(latestState);
  });
  listenForUpdates();
</script>
{% endblock %}
