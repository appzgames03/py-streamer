<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}pyst — Media Server{% endblock %}</title>
  <style>
    :root {
      --bg-color: #0e1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --success: #3fb950;
      --warning: #d29922;
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-stack);
      line-height: 1.6;
      padding-bottom: 3rem;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .brand span {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 400;
      margin-left: 0.5rem;
    }
    nav {
      display: flex;
      gap: 1.25rem;
      align-items: center;
    }
    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.15s ease-in-out;
    }
    nav a:hover, nav a.active {
      color: var(--text-color);
    }
    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
    }
    h1, h2, h3 {
      color: var(--text-color);
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 1rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 999px;
      line-height: 1;
    }
    .badge-success {
      background: rgba(63, 185, 80, 0.15);
      color: var(--success);
      border: 1px solid rgba(63, 185, 80, 0.3);
    }
    .badge-info {
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover {
      background: #21262d;
      border-color: #8b949e;
      text-decoration: none;
    }
    .btn-primary {
      background: #238636;
      border-color: rgba(240, 246, 252, 0.1);
      color: #fff;
    }
    .btn-primary:hover {
      background: #2ea043;
      border-color: rgba(240, 246, 252, 0.1);
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header>
    <a href="/" class="brand">pyst <span>media server</span></a>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/browse">File Browser</a>
      <a href="/sync">Sync Stream</a>
      <a href="/upload">Upload</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
